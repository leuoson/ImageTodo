[package]
name = "image-todo"
version = "0.1.0"
description = "ImageTodo desktop application"
authors = ["ImageTodo Team"]
edition = "2021"
license = "MIT"
rust-version = "1.70"
publish = false

[lib]
name = "image_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["fs", "sync", "rt"] }
